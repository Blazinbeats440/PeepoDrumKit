UTILITY_JPOS_REFERENCE_ANGLE = Reference direction angle
UTILITY_JPOS_ZIGZAG_DAMPED = Gradually reduce lateral amplitude
UTILITY_JPOS_ZIGZAG_DESC = Lateral amplitude is the distance to each side of the travel direction. Each cycle passes center, first side, center, opposite side, and center. Reference angles: right is 0 degrees, down is 90 degrees.
UTILITY_JPOS_RECTANGLE = Rectangle
UTILITY_JPOS_TRIANGLE = Isosceles triangle
UTILITY_JPOS_POLYGON_SHAPE = Orbit shape
UTILITY_JPOS_WIDTH = Width
UTILITY_JPOS_HEIGHT = Height
UTILITY_JPOS_ROTATION_ANGLE = Rotation angle
UTILITY_JPOS_POLYGON_DESC = The starting position is a vertex. At 0 degrees, clockwise travel begins to the right and then passes below. Linear easing assigns time in proportion to edge length.
UTILITY_JPOS_WAYPOINT_DESC = Arrival percentages refer to beats in the selected range. X and Y are relative to the starting position. Repeated coordinates create a hold. Use + to insert before the next point and - to remove.
UTILITY_JPOS_WAYPOINT_SAME_EASING = Use the same easing for all intervals
UTILITY_JPOS_ARRIVAL_PERCENT = Arrival (%)
UTILITY_JPOS_WAYPOINT_ACTIONS = Add / remove
UTILITY_JPOS_WAYPOINT_INTERVAL = Interval %d -> %d
UTILITY_JPOS_INVALID_WAYPOINTS = Arrival percentages must increase strictly from 0 to 100. The first point must be 0% at (0, 0), and the last 100%. Coordinates must be finite.
UTILITY_JPOS_INVALID_CURVE_MOTION = Check cycle count (up to 1024, 1365 for triangles, or 2048 for jumps). Radii, amplitudes and height must be finite and nonnegative; polygon width and height positive; angles finite; damping strength between 0 and 4.
UTILITY_JPOS_TURN_X = Turning point X
UTILITY_JPOS_TURN_Y = Turning point Y
UTILITY_JPOS_ROUND_TRIPS = Round trips
UTILITY_JPOS_OUTBOUND_RATIO = Outbound share
UTILITY_JPOS_OUTBOUND_DESC = The share is measured in beats within each round trip. Easing uses elapsed time within each leg.
UTILITY_JPOS_SAME_EASING = Use the same easing for both legs
UTILITY_JPOS_OUTBOUND_EASING = Outbound easing
UTILITY_JPOS_RETURN_EASING = Return easing
UTILITY_JPOS_POSITION_X = X position (time)
UTILITY_JPOS_POSITION_Y = Y position (time)
UTILITY_JPOS_TRAJECTORY = XY path (white dot: starting position)
UTILITY_JPOS_INVALID_MOTION = Enter 1-2048 round trips and an outbound share between 0 and 100 percent.
UTILITY_JPOS_INVALID_MOTION_GRID = The motion boundaries cannot be placed. Widen the range or reduce the motion cycles.
UTILITY_JPOS_INVALID_MOTION_TIMING = The beat resolution cannot represent the motion boundaries. Widen the range or adjust the motion settings.
UTILITY_JPOS_INVALID_STRENGTH = Enter an easing strength from 0 to 4.
UTILITY_JPOS_RANGE = Selected range: %.3f - %.3f beats (%.3f s)
UTILITY_JPOS_SELECT_RANGE = Select a range with a start and end on the timeline.
UTILITY_JPOS_EVENT_COUNT = Commands to generate: %d
UTILITY_JPOS_INTERRUPTS_PREVIOUS = Generation will stop the preceding JPOS movement at the start of this range.
UTILITY_JPOS_CONFLICT = The range already contains %d JPOS commands. Undo the previous generation or choose an empty range.
UTILITY_JPOS_INVALID_GRID = Check the timeline grid. Generation is limited to 4096 commands. Use a coarser grid, shorten the range, or reduce the motion cycles.
UTILITY_JPOS_TIMELINE_GRID = Timeline grid: 1 / %d
UTILITY_JPOS_TIMELINE_GRID_DESC = Split at the current timeline grid positions, also including range endpoints and required motion landmarks and waypoints.
UTILITY_JPOS_INVALID_MOVE = Enter finite X and Y movement values.
UTILITY_JPOS_INVALID_TIME = The range cannot be converted to valid movement times.
UTILITY_JPOS_INTERVAL_TOO_SHORT = A segment is shorter than 1 ms. Use a coarser timeline grid, reduce the motion cycles, or adjust waypoint arrivals.
UTILITY_JPOS_GENERATE = Generate
UTILITY_JPOS_GENERATED = Last generation: %d JPOS commands. Undo once to remove them before adjusting and regenerating.
