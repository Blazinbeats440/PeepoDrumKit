SETTINGS_TIMELINE_GRID_STARTS_AT_BAR = Timeline: Align Grid to Bar Starts
SETTINGS_TIMELINE_GRID_STARTS_AT_BAR_DESC = Start the grid at each bar line. Turn off to use the song start as the grid origin. The default shortcut is F6.
SETTINGS_TIMELINE_LOOP_PLAYBACK = Timeline: Loop Playback
SETTINGS_TIMELINE_LOOP_PLAYBACK_DESC = When enabled, playback repeats the selected range on the timeline.
SETTINGS_EVENT_SHOW_SUDDEN = Chart Events: Show Sudden
SETTINGS_EVENT_SHOW_SUDDEN_DESC = Show the Sudden field in the Chart Events window. It is always shown when the chart contains #SUDDEN.
SETTINGS_EVENT_SHOW_JPOS_SCROLL = Chart Events: Show JPOS Scroll
SETTINGS_EVENT_SHOW_JPOS_SCROLL_DESC = Show the JPOS Scroll field in the Chart Events window. It is always shown when the chart contains #JPOSSCROLL.
SETTINGS_EVENT_SHOW_SCROLL_TYPE = Chart Events: Show Scroll Type
SETTINGS_EVENT_SHOW_SCROLL_TYPE_DESC = Show the Scroll Type field in the Chart Events window. It is always shown when the chart contains #NMSCROLL, #HBSCROLL, or #BMSCROLL.
SETTINGS_EVENT_SHOW_DELAY = Chart Events: Show DELAY
SETTINGS_EVENT_SHOW_DELAY_DESC = Show the DELAY field in the Chart Events window. It is always shown when the chart contains #DELAY.
SETTINGS_SCROLL_SPEED_VIEW_TYPE = Chart Preview: Scroll Speed View Type
SETTINGS_SCROLL_SPEED_VIEW_TYPE_DESC = Select how complex scroll speeds are displayed in the chart preview.
