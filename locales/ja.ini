INSPECTOR_SCROLL_DIRECTION = 方向
INSPECTOR_SCROLL_STATIONARY_DESC = 速度0のSCROLLは方向が未定義です。入力した角度は選択中に保持し、速度を上げたときに使用します。
INSPECTOR_SCROLL_ZERO_BPM = BPMが0の対象を含むためBPM入力は使えません。速度を編集するには単位をxに切り替えてください。
