INSPECTOR_SCROLL_PATH_SHORTEST = 最短経路を通る
INSPECTOR_SCROLL_PATH_DIRECT = 通常角度を入力
INSPECTOR_SCROLL_ANGLE_PATH_DESC = 最短経路では360度の境界をまたぐ最短の向きに補間します。入力角度どおりでは0→360で1周、0→-360で逆向きに1周します。回転数は編集中の状態であり、TJAには保存しません。
