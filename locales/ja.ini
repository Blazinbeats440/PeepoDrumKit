TEST_PLAY_BALLOON_HITS = 風船打数
TEST_PLAY_BALLOON_POP = 風船破裂数
TEST_PLAY_EDITOR_LOCKED = テストプレイ中は譜面を編集できません。
SETTINGS_TAB_APPEARANCE = アピアランス
SETTINGS_APPEARANCE_MARKER_LINE_COLOR = マーカー線の色
SETTINGS_APPEARANCE_BRANCH_START_LINE_COLOR = 分岐開始線の色
SETTINGS_APPEARANCE_BRANCH_AREA_COLOR = 分岐エリアの色
SETTINGS_APPEARANCE_PREVIEW_BRANCH_EXPERT_LANE_COLOR = 譜面プレビュー: 玄人レーンの背景色
SETTINGS_APPEARANCE_PREVIEW_BRANCH_MASTER_LANE_COLOR = 譜面プレビュー: 達人レーンの背景色
SETTINGS_APPEARANCE_PREVIEW_COMMENT_TEXT_COLOR = 譜面プレビュー: コメントの文字色
SETTINGS_APPEARANCE_PREVIEW_COMMENT_OUTLINE_COLOR = 譜面プレビュー: コメントの縁取り色
SETTINGS_TIMELINE_SHOW_BRANCH_START_LINES = タイムライン: 分岐開始線を表示
SETTINGS_TIMELINE_SHOW_BRANCH_START_LINES_DESC = タイムライン上の#BRANCHSTART位置に分岐開始線を表示します。
SETTINGS_PREVIEW_SHOW_MEASURE_NUMBERS = 譜面プレビュー: 小節番号を表示
SETTINGS_PREVIEW_SHOW_MEASURE_NUMBERS_DESC = 譜面プレビューの小節番号の表示方法を選択します。「非表示の小節線も表示」では、小節線が非表示の位置にも番号を表示します。
SETTINGS_PREVIEW_MEASURE_NUMBERS_VISIBLE = 表示
FOLDER_DROP_TITLE = フォルダ・圧縮ファイルから譜面を開く
FOLDER_DROP_SELECT_CHART = 開くTJAファイルを選択してください。
FOLDER_DROP_NO_CHARTS = 設定された検索階層の範囲内にTJAファイルが見つかりませんでした。
FOLDER_DROP_READ_FAILED = フォルダまたは圧縮ファイルを読み取れませんでした。
FOLDER_DROP_LOADING = 譜面を検索／圧縮ファイルを展開しています…
ZIP_DROP_INVALID = ZIPファイルが破損しているか、正しい形式ではありません。
ZIP_DROP_UNSUPPORTED = ZIP64・分割ZIP、および無圧縮／Deflate以外の圧縮形式には対応していません。
ARCHIVE_DROP_INVALID = 圧縮ファイルが破損しているか、正しい形式ではありません。
ARCHIVE_DROP_UNSUPPORTED = この圧縮ファイルの形式、または圧縮方式には対応していません。
ARCHIVE_DROP_PASSWORD_PROTECTED = この圧縮ファイルはパスワード付きのため開けません。
ZIP_DROP_UNSAFE_PATH = 圧縮ファイル内に展開できないファイルパス、または未対応のリンクが含まれています。
ZIP_DROP_SIZE_LIMIT = 圧縮ファイルのサイズ制限を超えています（圧縮ファイル: 1GiB、1ファイル: 256MiB、展開後合計: 2GiB）。
ZIP_DROP_EXTRACTION_FAILED = 圧縮ファイルを展開できませんでした。書き込み権限と空き容量を確認してください。展開済みのファイルは残ります。
SETTINGS_PREVIEW_MEASURE_NUMBERS_HIDDEN = 非表示
SETTINGS_PREVIEW_MEASURE_NUMBERS_ALL = 非表示の小節線も表示
SETTINGS_PREVIEW_SHOW_JPOS_POSITION = 譜面プレビュー: JPOSの現在位置を表示
SETTINGS_PREVIEW_SHOW_JPOS_POSITION_DESC = 判定枠付近に現在のJPOS座標を表示します。書き出し動画にも反映されます。
SETTINGS_PREVIEW_UNSELECTED_NOTE_TOOLTIPS = 譜面プレビュー: 未選択ノートもホバー詳細を表示
SETTINGS_PREVIEW_UNSELECTED_NOTE_TOOLTIPS_DESC = ノートの選択状態にかかわらず、マウスを重ねると詳細情報を表示します。OFFの場合は選択中のノートのみ表示します。
SETTINGS_PREVIEW_COMMENT_HOLD_MEASURES = 譜面プレビュー: コメントの残留小節数
SETTINGS_PREVIEW_COMMENT_HOLD_MEASURES_DESC = 判定位置に到達後、指定小節数だけコメントを残します。0ではそのまま流れます。
SETTINGS_TIMELINE_PLAYBACK_CURSOR_FOLLOW = タイムライン: 再生中のカーソル追従
SETTINGS_TIMELINE_PLAYBACK_CURSOR_FOLLOW_DESC = オンにすると、再生中はタイムラインがカーソルに追従します。
SETTINGS_TIMELINE_GRID_STARTS_AT_BAR = タイムライン: 小節頭をグリッドの基準にする
SETTINGS_TIMELINE_GRID_STARTS_AT_BAR_DESC = オンにすると小節ごとにグリッドを引き直します。オフにすると曲頭を基準にします。初期ショートカットはF6です。
SETTINGS_TIMELINE_LOOP_PLAYBACK = タイムライン: ループ再生
SETTINGS_TIMELINE_LOOP_PLAYBACK_DESC = オンにすると、タイムラインで範囲選択した区間を繰り返し再生します。
SETTINGS_TIMELINE_AUTO_STEP_AFTER_NOTE_INPUT = タイムライン: 音符入力後に自動でグリッド移動
SETTINGS_TIMELINE_AUTO_STEP_AFTER_NOTE_INPUT_DESC = オンにすると、音符を入力した後に現在のグリッド単位でカーソルを進めます。ショートカットはF7です。
SETTINGS_EVENT_SHOW_SUDDEN = 譜面イベント: Suddenを表示
SETTINGS_EVENT_SHOW_SUDDEN_DESC = 譜面イベントウインドウにSuddenの項目を表示します。譜面に#SUDDENが含まれる場合は常に表示されます。
SETTINGS_EVENT_SHOW_JPOS_SCROLL = 譜面イベント: 判定枠スクロールを表示
SETTINGS_EVENT_SHOW_JPOS_SCROLL_DESC = 譜面イベントウインドウに判定枠スクロールの項目を表示します。譜面に#JPOSSCROLLが含まれる場合は常に表示されます。
SETTINGS_EVENT_SHOW_SCROLL_TYPE = 譜面イベント: スクロールタイプを表示
SETTINGS_EVENT_SHOW_SCROLL_TYPE_DESC = 譜面イベントウインドウにスクロールタイプの項目を表示します。譜面に#NMSCROLL/#HBSCROLL/#BMSCROLLが含まれる場合は常に表示されます。
SETTINGS_SCROLL_SPEED_VIEW_TYPE = 譜面プレビュー: スクロールスピードの表示方式
SETTINGS_SCROLL_SPEED_VIEW_TYPE_DESC = 譜面プレビューで複素数のスクロールスピードを表示する方式を選択します。
SETTINGS_TAB_LANGUAGE = 言語
SETTINGS_GENERAL_LANGUAGE = 言語
SETTINGS_GENERAL_EXPORT_BUILTIN_LOCALE_FILES = 組み込みロケールファイルをエクスポート
SETTINGS_GENERAL_DEFAULT_CREATOR = 一般: 譜面作成者の初期値
SETTINGS_GENERAL_DEFAULT_CREATOR_DESC = 新しい譜面を作成するときに自動入力される名前です。
SETTINGS_VSYNC_OFF_FPS_LIMIT = 一般: 垂直同期オフ時の上限FPS
SETTINGS_VSYNC_OFF_FPS_LIMIT_DESC = 垂直同期をオフにしたときの描画FPSを制限します。0で無制限です。
SETTINGS_GENERAL_BALLOON_EXPECTED_HITS = 一般: 風船の想定打数/秒
SETTINGS_GENERAL_BALLOON_EXPECTED_HITS_DESC = Inspectorで使用する風船の想定打数/秒の初期値です。
SETTINGS_TJA_SAVE_FORMAT = TJA: ファイル保存形式
SETTINGS_TJA_SAVE_FORMAT_DESC = TJAファイルの保存に使用する文字コードと改行コードを選択します。
SETTINGS_TJA_WARN_TAIKOJIRO_INCOMPATIBLE = 太鼓さん次郎で再生できない譜面に警告を表示する
SETTINGS_TJA_WARN_TAIKOJIRO_INCOMPATIBLE_DESC = 該当する譜面を保存する際に警告を表示します。警告後も保存できます。
SAVE_TAIKOJIRO_COMPAT_WARNING_TITLE = 太鼓さん次郎との互換性に関する警告
SAVE_TAIKOJIRO_COMPAT_WARNING_DESC = 太鼓さん次郎で正しく再生できない可能性があります。警告後も譜面は保存されます。
SAVE_TAIKOJIRO_WARN_BRANCH_SCROLL = #BRANCHENDを使用しており、拍子線以外の位置に#SCROLLがあります。
SAVE_TAIKOJIRO_WARN_MEASURE_LENGTH = 1小節内の文字数が512文字以上です。
SAVE_TAIKOJIRO_WARN_TITLE_LENGTH = TITLEが128文字以上です。
SAVE_TAIKOJIRO_WARN_UTF8_JAPANESE_TITLE = 保存形式が「UTF-8(BOM), LF」で、TITLEまたはSUBTITLEに2バイト文字が含まれています。
SETTINGS_TJA_INCLUDE_HEADER = TJA: PeepoDrumKitヘッダーを含める
SETTINGS_TJA_INCLUDE_HEADER_DESC = TJAファイルの保存時にPeepoDrumKit識別コメントを含めます。
SETTINGS_GENERAL_DRUMROLL_PREVIEW = 一般: 連打プレビューの毎秒再生数
SETTINGS_GENERAL_DRUMROLL_PREVIEW_DESC = プレビュー時に1秒あたり再生する連打音の数です。
SETTINGS_GENERAL_TIME_DISPLAY = 一般: 時間表示の基準
SETTINGS_GENERAL_TIME_DISPLAY_DESC = 譜面空間（00:00.000からの相対時間）または音源空間（音源オフセット基準）で時間を表示します。
SETTINGS_PROPERTIES_SHOW_TITLE_TRANSLATIONS = プロパティ: 曲名の翻訳欄を表示
SETTINGS_PROPERTIES_SHOW_TITLE_TRANSLATIONS_DESC = 譜面プロパティに曲名の翻訳欄を表示します。
SETTINGS_PROPERTIES_SHOW_SUBTITLE_TRANSLATIONS = プロパティ: サブタイトルの翻訳欄を表示
SETTINGS_PROPERTIES_SHOW_SUBTITLE_TRANSLATIONS_DESC = 譜面プロパティにサブタイトルの翻訳欄を表示します。
SETTINGS_PROPERTIES_SHOW_CHART_METADATA = プロパティ: その他の楽曲ヘッダーを表示
SETTINGS_PROPERTIES_SHOW_CHART_METADATA_DESC = 譜面プロパティに楽曲の追加ヘッダー欄を表示します。
SETTINGS_PROPERTIES_SHOW_COURSE_METADATA = プロパティ: その他のコースヘッダーを表示
SETTINGS_PROPERTIES_SHOW_COURSE_METADATA_DESC = 譜面プロパティにコースの追加ヘッダー欄を表示します。
SETTINGS_BRANCH_SHOW_FORCED_BRANCH_BUTTONS = 譜面分岐: 強制分岐ボタンを表示
SETTINGS_BRANCH_SHOW_FORCED_BRANCH_BUTTONS_DESC = 譜面分岐ウィンドウに普通・玄人・達人への強制分岐ボタンを表示します。
SETTINGS_TIMELINE_INVERT_SCROLL = タイムライン: マウスホイールの向きを反転
SETTINGS_TIMELINE_INVERT_SCROLL_DESC = マウスホイールを下へ回したとき、タイムラインが先へ進むように向きを反転します。
SETTINGS_TIMELINE_SCROLL_SENSITIVITY = タイムライン: スクロール感度
SETTINGS_TIMELINE_SCROLL_SENSITIVITY_DESC = マウスホイール1目盛りで移動するタイムラインの距離です。
SETTINGS_TIMELINE_SCROLL_SENSITIVITY_SHIFT = タイムライン: スクロール感度（Shift）
SETTINGS_TIMELINE_SCROLL_SENSITIVITY_SHIFT_DESC = Shiftキーを押しながらマウスホイールを回したときの移動距離です。
SETTINGS_GRID_DIVISIONS = タイムライン: グリッド分割候補
SETTINGS_GRID_DIVISIONS_DESC = 通常のグリッド分割変更時に選択される候補です。正の整数に統一され、昇順かつ重複なしで保存されます。
SETTINGS_GRID_DIVISIONS_ROUGH = タイムライン: グリッド分割候補（Shift）
SETTINGS_GRID_DIVISIONS_ROUGH_DESC = Shiftキーを押しながらグリッド分割を変更したときに選択される候補です。
SETTINGS_GRID_DIVISIONS_PRECISE = タイムライン: グリッド分割候補（Alt）
SETTINGS_GRID_DIVISIONS_PRECISE_DESC = Altキーを押しながらグリッド分割を変更したときに選択される候補です。
SETTINGS_ANIMATION_SMOOTH_ZOOM = アニメーション: UIズームを滑らかにする
SETTINGS_ANIMATION_SMOOTH_ZOOM_DESC = UIのズーム倍率を滑らかにアニメーションさせます。
SETTINGS_ANIMATION_SCROLL_SPEED = アニメーション: タイムラインのスクロール速度
SETTINGS_ANIMATION_SCROLL_SPEED_DESC = タイムラインをスクロールするときのアニメーション速度です。
SETTINGS_ANIMATION_CURSOR_SPEED = アニメーション: タイムラインカーソル速度
SETTINGS_ANIMATION_CURSOR_SPEED_DESC = カーソルが新しい位置へ移動するときのアニメーション速度です。
SETTINGS_ANIMATION_RANGE_SPEED = アニメーション: 範囲選択速度
SETTINGS_ANIMATION_RANGE_SPEED_DESC = 範囲選択を拡張するときのアニメーション速度です。
SETTINGS_AUDIO_OPEN_STARTUP = 起動時にデバイスを開く
SETTINGS_AUDIO_MASTER_VOLUME = マスターボリューム
SETTINGS_AUDIO_MASTER_VOLUME_DESC = アプリケーション全体の音量を設定します。
SETTINGS_AUDIO_BALLOON_VOLUME = 風船音の音量
SETTINGS_AUDIO_BALLOON_VOLUME_DESC = 譜面の音色の音量とは別に、風船音の音量を設定します。
SETTINGS_AUDIO_METRONOME_VOLUME = メトロノームの音量
SETTINGS_AUDIO_METRONOME_VOLUME_DESC = メトロノーム音の音量を設定します。
SETTINGS_AUDIO_OPEN_STARTUP_DESC = プログラム起動直後にオーディオセッションを作成します。
SETTINGS_AUDIO_CLOSE_FOCUS_LOSS = フォーカス喪失時にデバイスを閉じる
SETTINGS_AUDIO_CLOSE_FOCUS_LOSS_DESC = ウィンドウのフォーカスを失い、音を再生していないときにオーディオセッションを自動的に閉じます。
SETTINGS_AUDIO_EXCLUSIVE_MODE = 低遅延・排他モード
SETTINGS_AUDIO_EXCLUSIVE_MODE_DESC = デバイスへの排他アクセスを要求して音声遅延を減らします。他のアプリは音声の再生・録音ができなくなります。
SETTINGS_AUDIO_BUFFER_SIZE = バッファーフレーム数
SETTINGS_AUDIO_BUFFER_SIZE_DESC = 十分なバッファーサイズを要求して音声の歪みを防ぎます（音声遅延は増加します）。
SETTINGS_SEARCH_HINT = 入力して検索...
SETTINGS_RESET_DEFAULT = 初期値に戻す
SETTINGS_SONG_SPACE = 音源空間
SETTINGS_CHART_SPACE = 譜面空間
SETTINGS_TRUE_EXCLUSIVE = True（排他モード）
SETTINGS_FALSE = False
SETTINGS_DISABLE_ANIMATION = アニメーションを無効化
SETTINGS_CLEAR_ALL = すべて解除
SETTINGS_ACTION = 操作
SETTINGS_BINDING = キー割り当て
SETTINGS_REVERT_CHANGES = 変更を元に戻す
SETTINGS_UP = 上へ
SETTINGS_DOWN = 下へ
SETTINGS_REMOVE = 削除
