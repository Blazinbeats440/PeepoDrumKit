INSPECTOR_SCROLL_ANGLE_DESC = 正のBPMを基準としたSCROLLの方向です。右が0度、上が+90度です。スクロールの上下方向設定に従い、表示無効時は標準の向きを使います。角度を変更しても速度は維持します。
