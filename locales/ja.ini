UTILITY_JPOS_ZIGZAG_DESC = 横振幅は移動方向に対する片側の幅です。1回で中央→片側→中央→反対側→中央を通ります。基準方向は右が0度、下が90度です。
UTILITY_JPOS_RECTANGLE = 長方形
UTILITY_JPOS_TRIANGLE = 二等辺三角形
UTILITY_JPOS_POLYGON_SHAPE = 周回の形
UTILITY_JPOS_WIDTH = 幅
UTILITY_JPOS_HEIGHT = 高さ
UTILITY_JPOS_ROTATION_ANGLE = 回転角
UTILITY_JPOS_POLYGON_DESC = 開始位置を頂点として周回します。回転角0度・時計回りでは右へ進み、次に下側を通ります。一定速度では辺の長さに応じて時間を配分します。
UTILITY_JPOS_WAYPOINT_DESC = 到達割合は選択範囲の拍数に対する割合です。X・Yは開始位置からの相対座標です。同じ座標を続けると、その区間は停止します。＋で次の点との間に追加、－で削除できます。
UTILITY_JPOS_WAYPOINT_SAME_EASING = 各区間で同じイージングを使う
UTILITY_JPOS_ARRIVAL_PERCENT = 到達割合 (%)
UTILITY_JPOS_WAYPOINT_ACTIONS = 追加／削除
UTILITY_JPOS_WAYPOINT_INTERVAL = 区間 %d → %d
UTILITY_JPOS_INVALID_WAYPOINTS = 到達割合は0～100%の昇順で指定してください。始点は0%・(0, 0)、終点は100%にし、座標には有限の数値を指定してください。
UTILITY_JPOS_CURVE_GRID_DESC = 範囲全体の分割数です。折り返し・多角形の頂点・中央の通過点・跳ねる頂点と着地点を含めます。曲線の軌跡は折れ線で近似します。
UTILITY_JPOS_WAYPOINT_GRID_DESC = 範囲全体の分割数を各区間へ配分し、すべての経由点を必ず含めます。
UTILITY_JPOS_INVALID_CURVE_GRID = この動きには最低%d分割が必要です。分割グリッドを増やすか、回数を減らしてください。
UTILITY_JPOS_INVALID_CURVE_MOTION = 回数は1～1024回（三角形は1365回、跳ねる動きは2048回まで）、半径・振幅・高さは0以上、多角形の幅・高さは0より大きい数値、角度は有限の数値、減衰の強さは0～4で指定してください。
UTILITY_JPOS_TURN_X = 折り返し地点X
UTILITY_JPOS_TURN_Y = 折り返し地点Y
UTILITY_JPOS_ROUND_TRIPS = 往復回数
UTILITY_JPOS_OUTBOUND_RATIO = 往路の割合
UTILITY_JPOS_OUTBOUND_DESC = 割合は各往復の拍数を基準にします。イージングは往路・復路それぞれの実時間で計算します。
UTILITY_JPOS_SAME_EASING = 往路・復路で同じイージングを使う
UTILITY_JPOS_OUTBOUND_EASING = 往路イージング
UTILITY_JPOS_RETURN_EASING = 復路イージング
UTILITY_JPOS_MOTION_GRID_DESC = 選択範囲全体の分割数です。各折り返し・帰着地点を必ず含めます（1～4096）。
UTILITY_JPOS_POSITION_X = X位置（時間）
UTILITY_JPOS_POSITION_Y = Y位置（時間）
UTILITY_JPOS_TRAJECTORY = XY軌跡（白点：開始位置）
UTILITY_JPOS_INVALID_MOTION = 往復回数は1～2048で、往路の割合は0%より大きく100%未満にしてください。
UTILITY_JPOS_INVALID_MOTION_GRID = 1往復につき最低2分割が必要です。分割グリッドを増やすか、往復回数を減らしてください。
UTILITY_JPOS_INVALID_MOTION_TIMING = 拍の分解能では動きの区切りを配置できません。範囲を広げるか、モーションの設定を調整してください。
UTILITY_JPOS_INVALID_STRENGTH = イージング強度は0～4の数値を指定してください。
UTILITY_JPOS_DIVISION_GRID = 分割グリッド
UTILITY_JPOS_GRID_DESC = 選択範囲全体を、この数で等分します（1～4096）。
UTILITY_JPOS_RANGE = 選択範囲: %.3f ～ %.3f 拍（%.3f秒）
UTILITY_JPOS_SELECT_RANGE = タイムラインで開始と終了のある範囲を選択してください。
UTILITY_JPOS_EVENT_COUNT = 生成する命令数: %d
UTILITY_JPOS_INTERRUPTS_PREVIOUS = 生成すると、直前のJPOS移動をこの範囲の開始位置で打ち切ります。
UTILITY_JPOS_CONFLICT = 範囲内にJPOSが%d件あります。前回の生成をUndoするか、JPOSのない範囲を選択してください。
UTILITY_JPOS_INVALID_GRID = 分割グリッドは1～4096で、選択範囲の拍の分解能に収まる数を入力してください。
UTILITY_JPOS_INVALID_MOVE = X・Y移動量には有限の数値を入力してください。
UTILITY_JPOS_INVALID_TIME = 選択範囲から有効な移動時間を計算できません。
UTILITY_JPOS_INTERVAL_TOO_SHORT = 1区間が1ミリ秒未満になります。分割グリッドを減らすか、範囲を広げてください。
UTILITY_JPOS_GENERATE = 生成
