TEST_PLAY_RECORDS = 記録
TEST_PLAY_AVERAGE_MS = 判定平均
TEST_PLAY_STDDEV_MS = 標準偏差
TEST_PLAY_CLEAR_ALL_RECORDS = 全記録をクリア
TEST_PLAY_CLEAR_RANGE_RECORDS = 選択範囲の記録をクリア
TEST_PLAY_CLEAR_RANGE = 範囲選択を解除
TEST_PLAY_CURRENT_ATTEMPT = 今回の集計
TEST_PLAY_SAVED_RECORDS_STATS = 保存された音符別記録
